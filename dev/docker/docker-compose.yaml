# Local infrastructure for development and integration tests.
# Started by `task dev:up` (versions from versions.env, credentials from .env).
# Every port is bound to 127.0.0.1 only: dev databases must never be reachable from the network.
#
# Profile "cluster" (`task dev:cluster`) adds 2 API + 2 worker replicas built from the
# Dockerfiles, each with its own Snowflake worker id, talking to the same MongoDB, Redis
# and Kafka — the smallest demonstration that nothing in the services is single-instance.
name: xsocial

x-replica-env: &replica-env
  # In-network addresses; the host-side .env points at localhost instead.
  MONGODB_URI_PRIMARY: mongodb://mongo:27017/?authSource=admin
  MONGODB_USERNAME_PRIMARY: ${MONGO_INITDB_ROOT_USERNAME}
  MONGODB_PASSWORD_PRIMARY: ${MONGO_INITDB_ROOT_PASSWORD}
  CACHE_ADDRESS: redis:6379
  CACHE_PASSWORD: ${CACHE_PASSWORD}
  CACHE_TYPE: redis
  NOTIFICATION_BROKER: kafka
  KAFKA_BROKERS: kafka:19092
  JWT_KEY: ${JWT_KEY}
  OTEL_ENDPOINT: jaeger:4317
  SNOWFLAKE_DATACENTER_ID: 1

x-api-replica: &api-replica
  build:
    context: ../..
    dockerfile: services/api/Dockerfile
    args:
      GO_VERSION: ${GO_VERSION}
      ALPINE_VERSION: ${ALPINE_VERSION}
  image: xsocial-api:cluster
  profiles: [cluster]
  restart: unless-stopped
  depends_on: [mongo, redis, kafka]
  networks: [xs-network]

x-worker-replica: &worker-replica
  build:
    context: ../..
    dockerfile: services/worker/Dockerfile
    args:
      GO_VERSION: ${GO_VERSION}
      ALPINE_VERSION: ${ALPINE_VERSION}
  image: xsocial-worker:cluster
  profiles: [cluster]
  restart: unless-stopped
  depends_on: [mongo, redis, kafka]
  networks: [xs-network]

services:
  mongo:
    image: mongo:${MONGO_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - xs-mongo-data:/data/db
    networks:
      - xs-network

  redis:
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${CACHE_PASSWORD}
    volumes:
      - xs-redis-data:/data
    networks:
      - xs-network

  kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://kafka:19092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 2 # auto-created topics get 2 partitions so 2 workers both consume
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${CLUSTER_ID}
    volumes:
      - xs-kafka-data:/var/lib/kafka/data
    networks:
      - xs-network

  kafdrop:
    image: obsidiandynamics/kafdrop:${KAFDROP_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:19092
    depends_on:
      - kafka
    networks:
      - xs-network

  jaeger:
    image: jaegertracing/all-in-one:${JAEGER_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:16686:16686" # Jaeger UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - xs-network

  # --- profile: cluster ---------------------------------------------------------
  api-1:
    <<: *api-replica
    environment:
      <<: *replica-env
      SNOWFLAKE_WORKER_ID: 1
    ports:
      - "127.0.0.1:8101:8080"

  api-2:
    <<: *api-replica
    environment:
      <<: *replica-env
      SNOWFLAKE_WORKER_ID: 2
    ports:
      - "127.0.0.1:8102:8080"

  worker-1:
    <<: *worker-replica
    environment:
      <<: *replica-env
      SNOWFLAKE_WORKER_ID: 3

  worker-2:
    <<: *worker-replica
    environment:
      <<: *replica-env
      SNOWFLAKE_WORKER_ID: 4

volumes:
  xs-mongo-data:
  xs-redis-data:
  xs-kafka-data:

networks:
  xs-network:
    driver: bridge