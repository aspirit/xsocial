# golangci-lint v2 configuration (run by `task lint`, the pre-commit hook and CI).
# Strict by default: the standard linters plus error-wrapping, security, style and
# complexity checks, with zero tolerated findings. Test files, generated code and a
# few directories get targeted exclusions below rather than a weaker global ruleset.
version: "2"

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 15m
  relative-path-mode: gomod
  issues-exit-code: 1
  tests: true
  concurrency: 4

output:
  sort-order:
    - severity
    - linter
    - file
  show-stats: true

severity:
  default: error

linters:
  default: standard
  enable:
    - dupl
    - err113
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
    - godot
    - goprintffuncname
    - inamedparam
    - maintidx
    - makezero
    - nlreturn
    - nolintlint
    - usestdlibvars
    - bodyclose
    - depguard

  settings:
    depguard:
      rules:
        # pkg/ is meant to be reusable and must not depend on internal/.
        pkg-no-internal:
          files:
            - "pkg/**"
          deny:
            - pkg: "github.com/aspirit/xsocial/internal"
              desc: "pkg/ must not import internal/ (define errors/types locally or move them to pkg/)"
    dupl:
      threshold: 150
    revive:
      rules:
        - name: package-comments
          severity: warning
        - name: function-length
          severity: warning
          arguments: [100, 150]
        - name: cyclomatic
          severity: warning
          arguments: [20]
        - name: cognitive-complexity
          severity: warning
          arguments: [15]
    gosec:
      excludes:
        - G101 # Hardcoded credentials
        - G102 # Binding to all interfaces
        - G106 # SSH insecure host key
        - G401 # Weak cryptographic primitives
        - G402 # TLS InsecureSkipVerify
        - G404 # Weak random number generator
        - G115 # Integer overflow conversion
    unparam:
      check-exported: false
    wrapcheck:
      ignore-sigs:
        - "github.com/gin-gonic/gin.(*Context).Error"
        - "github.com/gin-gonic/gin.(*Context).JSON"
        - "github.com/gin-gonic/gin.(*Context).String"
        - "fmt.Errorf"

  exclusions:
    paths:
      - internal/storage/mongo/collections.go
      - internal/storage/mongo/field/
      - wire_gen.go
      - mock_.*.go
      - docs/api/docs.go  # generated by swag, do not lint
    rules:
      # Rules for test files
      - path: (_test.go|services/api/tests/.*.go|.*mocks\.go)
        linters:
          - dupl
          - gosec
          - err113
          - wrapcheck
          - unparam
          - revive
          - bodyclose

      # Rules for specific directories
      - path: internal/storage/mongo/repository/.*.go
        linters:
          - dupl
      - path: tools/.*.go
        linters:
          - err113
          - gosec
      - path: internal/errors/.*.go
        linters:
          - dupl
      - path: internal/config/.*.go
        linters:
          - gosec